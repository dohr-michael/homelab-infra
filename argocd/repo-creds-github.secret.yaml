##############################################################################
# Gabarit de credentials ArgoCD pour TOUS les dépôts git@github.com:dohr-michael/*
#
# POURQUOI CE FICHIER
#   repo-ssh.secret.yaml est un Secret de type `repository` : il ne vaut que
#   pour l'URL exacte qu'il porte (homelab-infra). Un second dépôt applicatif
#   — temper-deploy — n'aurait aucune credential et le clone échouerait.
#   Ce Secret-ci est de type `repo-creds` : ArgoCD l'applique à toute URL
#   commençant par le préfixe ci-dessous. Ajouter un dépôt ne demandera donc
#   plus aucune modification côté ArgoCD.
#
#   Vérifié le 2026-08-08 : la deploy key de homelab-infra lit bien
#   temper-deploy (`git ls-remote` → exit 0). GitHub accepte une deploy key
#   pour la lecture d'un dépôt public tiers, donc aucune nouvelle clé à créer.
#   ⚠️ Ce ne sera PAS le cas pour un dépôt PRIVÉ : il faudra alors soit y
#   ajouter cette même clé publique en deploy key, soit passer à une clé de
#   machine-user.
#
# ⚠️ CLÉ DUPLIQUÉE avec argocd/repo-ssh.secret.yaml — c'est la même paire.
#   La faire tourner = éditer LES DEUX fichiers. Même piège que les
#   credentials RustFS (voir docs/critical-app-readiness.md §9).
#   L'alternative propre serait de supprimer repo-ssh.secret.yaml et de ne
#   garder que ce gabarit ; non fait pour l'instant, parce que casser la
#   credential du dépôt qui pilote ArgoCD est le genre de manœuvre qu'on ne
#   combine pas avec d'autres changements.
##############################################################################

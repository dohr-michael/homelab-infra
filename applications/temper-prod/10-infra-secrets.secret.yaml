##############################################################################
# Secrets d'infrastructure consommés par l'application temper (PROD).
#
# Ce Secret est monté par les workloads déployés depuis temper-deploy.git —
# il n'est PAS géré par ce dépôt-là, volontairement : les credentials restent
# dans homelab-infra, chiffrés SOPS, et temper-deploy ne contient que du
# manifeste sans secret.
#
# MONGO_URI_SECRET
#   Recopié depuis le Secret `mongo-prod-temper-user-conn-str` généré par
#   l'opérateur Percona, **moins le `&tls=true`**. Ce n'est pas un oubli :
#   mongod tourne en `preferTLS` avec une `tlsCAFile` et SANS
#   `--tlsAllowConnectionsWithoutCertificates`, donc `tls=true` y signifie
#   TLS *mutuel* — la connexion échoue sans certificat client. Voir
#   docs/critical-app-readiness.md § « Se connecter : le DSN … et son piège TLS ».
#
#   ⚠️ Ce DSN est une COPIE. Si le mot de passe change dans
#   applications/mongodb-prod/mongo-temper-user.secret.yaml, il faut le
#   reporter ici — rien ne le fait automatiquement, un Secret ne traverse pas
#   les namespaces.
#
# S3_*
#   Bucket d'upload `familiar-natarajan-mdohr` (eu-west-par), PARTAGÉ entre dev
#   et prod, avec un utilisateur S3 distinct par environnement. Le cloisonnement
#   est donc au niveau des credentials, pas du bucket : un préfixe par
#   environnement côté application est vivement conseillé.
##############################################################################

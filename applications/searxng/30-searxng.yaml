##############################################################################
# SearXNG — métamoteur, image officielle (granian sur :8080).
#
# Tourne en searxng (977), pas en root : fsGroup rend le cache emptyDir
# inscriptible. L'entrypoint avertit encore que /etc/searxng (ConfigMap RO)
# appartient à root — sans conséquence, le fichier est lisible.
#
# Le pod part sur un VPS (pas de nodeSelector ; gmk-ai-master est tainté).
# L'IP publique de ce VPS est celle que voient Google & co.
##############################################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
      annotations:
        # Redémarre le pod quand la config change (sinon ConfigMap ignoré).
        homelab.dohrm.fr/config-rev: "2"
    spec:
      securityContext:
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        runAsNonRoot: true
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.9.25-12f8b6515
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: searxng
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: config
          configMap:
            name: searxng
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
spec:
  selector:
    app: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http

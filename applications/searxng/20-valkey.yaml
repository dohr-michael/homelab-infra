##############################################################################
# Valkey — état du limiter SearXNG (compteurs par IP, link_token).
#
# Aucune persistance, volontairement : l'état est éphémère par nature. Un
# redémarrage remet les compteurs à zéro, rien de plus.
##############################################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.2-alpine
          args: ["valkey-server", "--save", "", "--appendonly", "no", "--loglevel", "warning"]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey

##############################################################################
# MongoDB DEV — replica set à 1 membre sur gmk-ai-master
#
# POURQUOI 1 MEMBRE
#   Un RS mono-membre garde tout ce qui distingue un replica set d'un mongod
#   standalone : transactions multi-documents, change streams, causal
#   consistency, oplog (donc PITR PBM). Ce qu'il ne teste pas : élections et
#   failover. C'est le bon compromis pour du dev.
#   `unsafeFlags.replsetSize: true` est obligatoire, sinon l'opérateur refuse
#   une taille < 3.
#
# POURQUOI gmk-ai-master
#   48 Go de RAM et 950 Go de disque disponibles, contre 8 Go / ~42 Go sur les
#   VPS. Dev et prod côte à côte sur les VPS se battraient pour la mémoire.
#   Conséquence assumée : dev est indisponible quand le nœud maison est down.
#
# BACKUP
#   PBM pointe sur RustFS in-cluster, pas sur OVH. C'est là qu'on valide la
#   chaîne backup → restore sans toucher au S3 de prod ni le payer.
##############################################################################

---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: mongo-dev
  namespace: mongodb-dev
  finalizers:
    - percona.com/delete-psmdb-pods-in-order
spec:
  crVersion: 1.23.0
  image: percona/percona-server-mongodb:8.0.26-11
  imagePullPolicy: IfNotPresent

  updateStrategy: SmartUpdate
  upgradeOptions:
    versionServiceEndpoint: https://check.percona.com
    apply: disabled
    schedule: "0 2 * * *"
    setFCV: false

  # Autorise explicitement un RS de taille 1. Ne PAS reporter ce bloc en prod.
  unsafeFlags:
    replsetSize: true

  secrets:
    users: mongo-dev-users
    encryptionKey: mongo-dev-encryption-key

  tls:
    mode: preferTLS
    certManagementPolicy: auto
    certValidityDuration: 87600h

  defaultRWConcern:
    readConcern: majority
    writeConcern:
      w: majority
      wtimeout: 0

  # Pas de bloc `pmm:` — le CRD impose `pmm.image` dès que la clé est présente
  # (spec.pmm.required = ['image']), même avec enabled: false. On ne s'en sert
  # pas : les métriques viennent du sidecar mongodb_exporter vers VictoriaMetrics.

  sharding:
    enabled: false

  users:
    - name: app
      db: appdb
      passwordSecretRef:
        name: mongo-dev-app-user
        key: password
      roles:
        - name: readWrite
          db: appdb

  replsets:
    - name: rs0
      size: 1

      nodeSelector:
        role.homelab/mongodb-dev: "true"

      priorityClassName: homelab-best-effort

      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9216"
        prometheus.io/path: /metrics

      affinity:
        antiAffinityTopologyKey: kubernetes.io/hostname

      tolerations:
        - key: dedicated
          operator: Equal
          value: ai
          effect: NoSchedule

      # Pas de PDB utile à 1 membre : le drainer, c'est l'interrompre.
      expose:
        enabled: false
        type: ClusterIP

      configuration: |
        operationProfiling:
          mode: slowOp
          slowOpThresholdMs: 200
        systemLog:
          quiet: true

      storage:
        engine: wiredTiger
        wiredTiger:
          engineConfig:
            cacheSizeRatio: 0.5
            journalCompressor: snappy
          collectionConfig:
            blockCompressor: snappy
          indexConfig:
            prefixCompression: true

      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi

      volumeSpec:
        persistentVolumeClaim:
          storageClassName: local-path-retain
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

      sidecars:
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.52.0
          args:
            - --mongodb.uri=mongodb://127.0.0.1:27017/admin
            - --mongodb.direct-connect
            - --web.listen-address=:9216
            - --collect-all
            - --compatible-mode
          env:
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: mongo-dev-users
                  key: MONGODB_CLUSTER_MONITOR_USER
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-dev-users
                  key: MONGODB_CLUSTER_MONITOR_PASSWORD
          ports:
            - name: metrics
              containerPort: 9216
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi

  backup:
    enabled: true
    image: percona/percona-backup-mongodb:2.15.0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

    storages:
      rustfs:
        main: true
        type: s3
        s3:
          bucket: mongodb-backups
          region: us-east-1 # RustFS ignore la région, mais le SDK S3 l'exige
          endpointUrl: http://rustfs.rustfs.svc.cluster.local:9000
          prefix: mongodb-dev
          credentialsSecret: mongo-dev-backup-s3
          insecureSkipTLSVerify: true

    pitr:
      enabled: true
      oplogOnly: false
      oplogSpanMin: 10
      compressionType: gzip
      compressionLevel: 6

    tasks:
      # Toutes les 6 h en dev : on veut voir la chaîne de backup tourner
      # souvent pour la valider, pas archiver longtemps.
      - name: frequent-logical
        enabled: true
        schedule: "0 */6 * * *"
        type: logical
        # Obligatoire en pratique, bien que non "required" dans le CRD.
        storageName: rustfs
        retention:
          count: 4
          type: count
          deleteFromStorage: true
        compressionType: gzip
        compressionLevel: 6

##############################################################################
# Modèles en GitOps (pas STORE_MODEL_IN_DB). Postgres = keys / spend / UI.
#
# llama.cpp et whisper.cpp tournent dans ai-stack sur gmk-ai-master. LiteLLM
# ne dépend que de leurs Services internes Kubernetes.
# Clés cloud : sops applications/litellm/litellm.secret.yaml
##############################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    litellm_settings:
      drop_params: true

    model_list:
      ########################################################################
      # Qwen3.6-35B-A3B — multimodal (texte + image + vidéo).
      # `supports_vision: true` est le seul flag de capacité que litellm
      # expose ; il n'y a pas d'équivalent pour la vidéo, les content parts
      # vidéo passent en direct vers llama-server.
      # ⚠ Côté serveur, llama-server doit être lancé avec `--mmproj` (le
      # projecteur multimodal du repo GGUF) sinon toute requête image/vidéo
      # part en 400 — voir overlays/qwen35b-a3b.
      ########################################################################

      # 1. Pour tes agents de code (rapide, direct, sans monologue)
      - model_name: qwen-coder
        litellm_params:
          model: openai/local
          api_base: http://qwen35b-a3b-llm-server.ai-stack.svc.cluster.local:8080/v1
          api_key: "sk-no-key-required"
          temperature: 0.1
          extra_body:
            chat_template_kwargs:
              enable_thinking: false
        model_info:
          supports_vision: true

      # 2. Pour l'analyse complexe / maths / architecture (réflexion profonde)
      #    Plafonner le thinking = `--reasoning-budget N` au lancement du
      #    serveur ; aucun paramètre par requête ne le fait (testé b10664).
      - model_name: qwen-reasoning
        litellm_params:
          model: openai/local
          api_base: http://qwen35b-a3b-llm-server.ai-stack.svc.cluster.local:8080/v1
          api_key: "sk-no-key-required"
          temperature: 0.6
          extra_body:
            chat_template_kwargs:
              enable_thinking: true
        model_info:
          supports_vision: true

      # 3. Mode économique / rapide
      - model_name: qwen-fast
        litellm_params:
          model: openai/local
          api_base: http://qwen35b-a3b-llm-server.ai-stack.svc.cluster.local:8080/v1
          api_key: "sk-no-key-required"
          max_tokens: 1024
          extra_body:
            chat_template_kwargs:
              enable_thinking: false
        model_info:
          supports_vision: true

      ########################################################################
      # Décision : Qwen3.5-9B servi nu (ai-stack/overlays/qwen3.5-9b-decision).
      # Exposé ici pour les appels ad-hoc et l'inspection depuis l'UI.
      # Greedy, thinking coupé et sortie plafonnée au lancement du serveur
      # (--temp 0, --reasoning-budget 0, --n-predict 256) : inutile de les
      # rejouer ici.
      #
      # ⚠ Le module de décision ne doit PAS passer par LiteLLM :
      # `drop_params: true` ci-dessus élague les paramètres hors spec
      # OpenAI, or il dépend de champs propres à llama-server (`n_probs`,
      # `post_sampling_probs`) et attaque /completion, pas /v1/chat.
      # Il tape le Service en direct :
      #   http://qwen3-5-9b-decision-llm-server.ai-stack.svc.cluster.local:8080
      ########################################################################
      - model_name: qwen-decision
        litellm_params:
          model: openai/qwen3.5-9b-decision
          api_base: http://qwen3-5-9b-decision-llm-server.ai-stack.svc.cluster.local:8080/v1
          api_key: "sk-no-key-required"

      # Embeddings : Qwen3-Embedding-4B (2560 dims). Changer de modèle
      # d'embedding invalide tout index vectoriel existant — réindexer.
      - model_name: qwen3-embedding-4b
        litellm_params:
          model: openai/qwen3-embedding-4b
          api_base: http://qwen3-embedding-4b-llm-server.ai-stack.svc.cluster.local:8080/v1
          api_key: "sk-no-key-required"


      # whisper.cpp dans ai-stack, exposé par Service Kubernetes.
      - model_name: whisper-cpp
        litellm_params:
          model: openai/ggml-large-v3-turbo
          api_base: http://whisper-server.ai-stack.svc.cluster.local:8080/v1
          api_key: "sk-no-key-required"

      # WebSocket Realtime local : Whisper → Qwen 3.6 → Qwen3-TTS.
      - model_name: local-voice
        litellm_params:
          model: openai/local-voice
          api_base: http://voice-pipeline.litellm.svc.cluster.local:8082/v1
          api_key: "sk-no-key-required"
        model_info:
          mode: realtime

      - model_name: gemini-3.8-flash
        litellm_params:
          model: gemini/gemini-3.8-flash
          api_key: os.environ/GEMINI_API_KEY

      - model_name: mistral
        litellm_params:
          model: mistral/mistral-large-latest
          api_key: os.environ/MISTRAL_API_KEY

      ########################################################################
      # DeepSeek (https://api.deepseek.com) — lineup V4 :
      #   deepseek-v4-flash  : rapide / éco (alias glissant vers la dernière
      #                        version, aujourd'hui V4-Flash-0731)
      #   deepseek-v4-pro    : raisonnement lourd (V4-Pro-0813), ~3x le prix
      # Contexte 1M tokens, 393k tokens de sortie max pour les deux.
      # Thinking mode est ON par défaut (effort `high`). On le pilote via
      # extra_body (format OpenAI natif de DeepSeek) pour ne pas dépendre du
      # mapping litellm. En thinking, temperature / top_p / penalties sont
      # ignorés — d'où l'absence de temperature sur les modèles "reasoning".
      ########################################################################

      # 1. Chat / code au quotidien : réponse directe, pas de monologue
      - model_name: deepseek
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY
          temperature: 0.1
          extra_body:
            thinking:
              type: disabled

      # 2. Raisonnement à coût contenu (flash + thinking)
      - model_name: deepseek-reasoning
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY
          extra_body:
            thinking:
              type: enabled
            reasoning_effort: high

      # 3. Le gros calibre : archi / maths / debug retors
      - model_name: deepseek-pro
        litellm_params:
          model: deepseek/deepseek-v4-pro
          api_key: os.environ/DEEPSEEK_API_KEY
          extra_body:
            thinking:
              type: enabled
            reasoning_effort: max

      # 4. Vision (expérimental côté DeepSeek, peut casser sans préavis)
      - model_name: deepseek-vision
        litellm_params:
          model: deepseek/deepseek-v4-flash-vision-exp
          api_key: os.environ/DEEPSEEK_API_KEY
          extra_body:
            thinking:
              type: disabled

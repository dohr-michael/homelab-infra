##############################################################################
# Prototype Realtime sur l'hôte Strix Halo, hors k3s.
# Le serveur Podman écoute sur 100.64.0.4:8082.
##############################################################################
---
apiVersion: v1
kind: Service
metadata:
  name: voice-pipeline
  namespace: litellm
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: voice-pipeline
  namespace: litellm
subsets:
  - addresses:
      - ip: 100.64.0.4
    ports:
      - name: http
        port: 8082
        protocol: TCP

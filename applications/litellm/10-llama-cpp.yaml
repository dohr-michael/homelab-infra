##############################################################################
# llama.cpp server sur l'hôte GMK (100.64.0.4), hors cluster.
# API OpenAI-compatible sur /v1 (un seul modèle chargé à la fois).
##############################################################################
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp
  namespace: litellm
  labels:
    app: llama-cpp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: llama-cpp-static
  namespace: litellm
  labels:
    kubernetes.io/service-name: llama-cpp
addressType: IPv4
endpoints:
  - addresses:
      - 100.64.0.4   # gmk-ai-master (IP Headscale)
    conditions:
      ready: true
ports:
  - name: http
    port: 8080
    protocol: TCP

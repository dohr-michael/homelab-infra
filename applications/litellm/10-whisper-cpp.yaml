##############################################################################
# whisper.cpp server sur l'hôte GMK (100.64.0.4), hors cluster.
##############################################################################
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-cpp
  namespace: litellm
  labels:
    app: whisper-cpp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP

---
apiVersion: v1
kind: Endpoints
metadata:
  name: whisper-cpp
  namespace: litellm
subsets:
  - addresses:
      - ip: 100.64.0.4
    ports:
      - name: http
        port: 8081
        protocol: TCP

##############################################################################
# whisper.cpp server sur l'hôte GMK (100.64.0.4), hors cluster.
##############################################################################
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-cpp
  namespace: litellm
  labels:
    app: whisper-cpp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: whisper-cpp-static
  namespace: litellm
  labels:
    kubernetes.io/service-name: whisper-cpp
addressType: IPv4
endpoints:
  - addresses:
      - 100.64.0.4   # gmk-ai-master (IP Headscale)
    conditions:
      ready: true
ports:
  - name: http
    port: 8081
    protocol: TCP

##############################################################################
# LiteLLM Proxy — gateway OpenAI-compatible, CPU, 1 replica.
# Image database : Prisma inclus. Pas de Redis (un seul pod).
##############################################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      # Pas de taint GPU, pas de CriticalAddonsOnly → VPS a7c3e9b8 ou 4541d883.
      priorityClassName: homelab-platform
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm-database:v1.98.0
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/config.yaml
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: LITELLM_DISABLE_NO_REDIS_WARNING
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: DATABASE_URL
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: LITELLM_SALT_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: GEMINI_API_KEY
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: MISTRAL_API_KEY
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: DEEPSEEK_API_KEY
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: config
          configMap:
            name: litellm-config

---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
  labels:
    app: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP

##############################################################################
# Service scrape VictoriaMetrics — le Service webhook n'expose que 9443.
##############################################################################
---
apiVersion: v1
kind: Service
metadata:
  name: cnpg-controller-metrics
  labels:
    app.kubernetes.io/name: cloudnative-pg
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudnative-pg
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP

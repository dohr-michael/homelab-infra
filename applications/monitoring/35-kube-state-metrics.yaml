##############################################################################
# kube-state-metrics — état des objets Kubernetes + CR custom
#
# L'intérêt principal ici n'est pas l'état des Deployments (cAdvisor le couvre
# en partie) mais la config `customresourcestate` : elle transforme les CR
# PerconaServerMongoDBBackup et Argo CD Application en métriques.
#
# C'est ce qui rend possible les deux alertes qui comptent vraiment :
#   - « aucun backup MongoDB terminé depuis plus de 36 h »
#   - « le repo-server ArgoCD ne synchronise plus » (le mode de panne
#     réellement observé sur ce cluster : 28 jours sans sync sans un bruit)
##############################################################################

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  # Le RBAC est aligné sur le flag --resources du Deployment : on n'accorde que
  # ce qui est réellement collecté. `secrets` est volontairement absent (un
  # `list` renverrait leur contenu) et `endpointslices` aussi, puisqu'on ne les
  # collecte pas — c'est ce couple qui faisait boucler KSM en erreur RBAC.
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - resourcequotas
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
    verbs: [list, watch]
  - apiGroups: ["apps"]
    resources: [statefulsets, daemonsets, deployments, replicasets]
    verbs: [list, watch]
  - apiGroups: ["batch"]
    resources: [cronjobs, jobs]
    verbs: [list, watch]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [list, watch]
  - apiGroups: ["storage.k8s.io"]
    resources: [storageclasses]
    verbs: [list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [list, watch]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [list, watch]
  # Requis par customresourcestate : KSM résout les CRD avant de watcher les CR.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: ["psmdb.percona.com"]
    resources:
      - perconaservermongodbs
      - perconaservermongodbbackups
      - perconaservermongodbrestores
    verbs: [list, watch]
  - apiGroups: ["argoproj.io"]
    resources: [applications, applicationsets, appprojects]
    verbs: [list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      priorityClassName: homelab-platform
      nodeSelector:
        role.homelab/monitoring: "true"
      tolerations:
        - key: dedicated
          operator: Equal
          value: ai
          effect: NoSchedule
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1
          imagePullPolicy: IfNotPresent
          args:
            - --host=0.0.0.0
            - --port=8080
            - --telemetry-host=0.0.0.0
            - --telemetry-port=8081
            - --custom-resource-state-config-file=/etc/ksm/customresourcestate.yml
            # false = on garde AUSSI les métriques Kubernetes standard.
            - --custom-resource-state-only=false
            ##################################################################
            # Liste EXPLICITE des ressources collectées.
            #
            # Sans ce flag, KSM collecte sa liste par défaut, qui inclut
            # `secrets` et `endpointslices` — et boucle en erreur RBAC sur les
            # deux (constaté au premier déploiement, CrashLoopBackOff).
            #
            # La bonne réponse n'est pas d'élargir le RBAC : c'est de ne pas
            # collecter ce dont on n'a pas besoin. Un `list` sur les secrets
            # renvoie leur contenu, et aucune alerte n'en dépend.
            #
            # Cette liste couvre exactement ce que consomment les règles de
            # files/alert-rules.yml : nodes, pods, statefulsets, services
            # (UnexpectedPubliclyExposedService), pvc/pv, cronjobs/jobs
            # (backups), pdb, namespaces.
            ##################################################################
            - --resources=cronjobs,daemonsets,deployments,ingresses,jobs,leases,namespaces,nodes,persistentvolumeclaims,persistentvolumes,poddisruptionbudgets,pods,replicasets,resourcequotas,services,statefulsets,storageclasses
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: telemetry
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/ksm
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: telemetry
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: config
          configMap:
            name: kube-state-metrics-crs

---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
    - name: telemetry
      port: 8081
      targetPort: telemetry
      protocol: TCP

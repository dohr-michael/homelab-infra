##############################################################################
# Credentials des canaux de notification.
#
# Montés en FICHIERS dans /etc/alertmanager/secrets/ et référencés par
# bot_token_file / chat_id_file / webhook_url_file dans
# files/alertmanager.yml. C'est ce qui permet de garder le routage en clair
# dans un repo public.
#
# ⚠️ PLACEHOLDERS — à remplir :
#     sops applications/monitoring/alertmanager.secret.yaml
#
# Telegram : créer un bot via @BotFather → token ; récupérer le chat_id en
#   écrivant au bot puis en appelant
#   https://api.telegram.org/bot<TOKEN>/getUpdates
# Discord : Paramètres du salon → Intégrations → Webhooks → Nouveau webhook.
#
# Les clés doivent être des valeurs BRUTES, sans saut de ligne final :
# Alertmanager lit le fichier tel quel.
##############################################################################

##############################################################################
# Snapshots etcd → OVH Object Storage
#
# ÉTAT ACTUEL DU CLUSTER (à corriger)
#   Les snapshots etcd existent mais sont en `file:///var/lib/rancher/k3s/...`
#   sur vps-17435151 UNIQUEMENT. Perdre ce VPS = perdre à la fois un membre
#   etcd et toutes les sauvegardes du cluster. C'est le trou le plus grave
#   avant d'héberger quoi que ce soit de critique.
#
# COMMENT ÇA MARCHE
#   k3s sait lire sa configuration S3 depuis un Secret de kube-system typé
#   `etcd.k3s.cattle.io/s3-config-secret`, dont les clés reprennent le nom des
#   flags CLI. C'est ce qui permet de versionner cette config ici plutôt que
#   d'écrire des credentials en clair dans /etc/rancher/k3s/config.yaml.
#
#   Côté nœud il reste juste deux lignes à ajouter (voir
#   docs/critical-app-readiness.md § « Snapshots etcd ») :
#     etcd-s3: true
#     etcd-s3-config-secret: etcd-s3-config
#
# ⚠️ LIMITE IMPORTANTE
#   Ce Secret est inutilisable pendant une RESTAURATION : l'apiserver est
#   arrêté, k3s ne peut donc pas le lire. La procédure de restore doit passer
#   les credentials en flags sur la ligne de commande. Ils sont donc à garder
#   accessibles hors cluster — le doc précise où.
#
# ⚠️ PLACEHOLDERS — à remplir après création du bucket OVH :
#     sops applications/cluster-baseline/etcd-s3.secret.yaml
##############################################################################

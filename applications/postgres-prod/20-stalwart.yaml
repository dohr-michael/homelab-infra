apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: stalwart
  namespace: postgres-prod
spec:
  name: stalwart
  login: true
  cluster:
    name: postgres-prod
  passwordSecret:
    name: stalwart-user
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: stalwart
  namespace: postgres-prod
spec:
  name: stalwart
  owner: stalwart
  cluster:
    name: postgres-prod
  databaseReclaimPolicy: retain

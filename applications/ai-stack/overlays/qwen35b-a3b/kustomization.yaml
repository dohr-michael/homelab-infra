resources:
  - ../../base

labels:
  - includeSelectors: true
    pairs:
      app: qwen35b-a3b
      role: chat

namePrefix: qwen35b-a3b-

patches:
  - target:
      kind: Deployment
      name: llm-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "8"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 48Gi
      - op: replace
        path: /spec/template/spec/initContainers/0/env
        value:
          - name: MODEL_PATH
            value: /models/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-Q6_K.gguf
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: MODEL_PATH
            value: /models/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-Q6_K.gguf
          - name: MODEL_ALIAS
            value: qwen35b-a3b
          - name: CTX_SIZE
            value: "65536"
          - name: PARALLEL_SLOTS
            value: "1"
          - name: THREADS
            value: "8"
          - name: CACHE_TYPE_K
            value: q8_0
          - name: CACHE_TYPE_V
            value: q8_0

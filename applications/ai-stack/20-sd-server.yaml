##############################################################################
# ComfyUI — exposé via Service + EndpointSlice (pattern headless)
#
# ComfyUI tourne directement sur gmk-ai-master (Strix Halo).
# K8s route le trafic sans gérer de pod.
#
# Port sur le nœud : 8000
##############################################################################

---
apiVersion: v1
kind: Service
metadata:
  name: sd-server
  namespace: ai-stack
  labels:
    app: sd-server
    component: image-gen
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: sd-server-static
  namespace: ai-stack
  labels:
    kubernetes.io/service-name: sd-server
addressType: IPv4
endpoints:
  - addresses:
      - 100.64.0.4   # gmk-ai-master (IP Headscale)
    conditions:
      ready: true
ports:
  - name: http
    port: 8000
    protocol: TCP

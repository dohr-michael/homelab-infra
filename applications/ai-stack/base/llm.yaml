##############################################################################
# Base llama.cpp ROCm pour Strix Halo.
# Chaque overlay fournit llm-server-config. Les modèles sont téléchargés et
# administrés manuellement sur gmk-ai-master, jamais au démarrage des pods.
##############################################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-server
  namespace: ai-stack
  labels:
    app: llm-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-server
  template:
    metadata:
      labels:
        app: llm-server
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: ai
          effect: NoSchedule
      nodeSelector:
        gpu-type: strix-halo
      initContainers:
        - name: check-model
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              test -f "$(MODEL_PATH)" || {
                echo "Model not found: $(MODEL_PATH)"
                find /models -maxdepth 3 -type f -print 2>/dev/null || true
                exit 1
              }
          env: []
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      containers:
        - name: llama-server
          image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-7.14
          imagePullPolicy: Always
          command: ["llama-server"]
          args:
            - --model
            - $(MODEL_PATH)
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --threads
            - $(THREADS)
            - --gpu-layers
            - "999"
            - --flash-attn
            - "1"
            - --ctx-size
            - $(CTX_SIZE)
            - --cache-type-k
            - $(CACHE_TYPE_K)
            - --cache-type-v
            - $(CACHE_TYPE_V)
            - --parallel
            - $(PARALLEL_SLOTS)
            - --no-mmap
            - --fit
            - "off"
            - --alias
            - $(MODEL_ALIAS)
            - --metrics
            - --no-ui
          env: []
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: dri
              mountPath: /dev/dri
            - name: kfd
              mountPath: /dev/kfd
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: models
          persistentVolumeClaim:
            claimName: ai-models-llm-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: llm-server
  namespace: ai-stack
  labels:
    app: llm-server
spec:
  type: ClusterIP
  selector:
    app: llm-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

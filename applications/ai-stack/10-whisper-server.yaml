##############################################################################
# whisper.cpp ROCm sur Strix Halo. Le modèle reste géré sur l'hôte GMK.
##############################################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-server
  namespace: ai-stack
  labels:
    app: whisper-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whisper-server
  template:
    metadata:
      labels:
        app: whisper-server
    spec:
      hostIPC: true
      tolerations:
        - key: dedicated
          operator: Equal
          value: ai
          effect: NoSchedule
      nodeSelector:
        gpu-type: strix-halo
      initContainers:
        - name: check-model
          image: busybox:1.37
          command: ["sh", "-c"]
          args: ["test -f /models/ggml-large-v3-turbo.bin"]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      containers:
        - name: whisper-server
          image: ghcr.io/dohr-michael/whisper-strix-halo-toolboxes:rocm-fedora43
          imagePullPolicy: Always
          command: ["whisper-server"]
          args:
            - --model
            - /models/ggml-large-v3-turbo.bin
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --inference-path
            - /v1/audio/transcriptions
            - --threads
            - "4"
            - --print-progress
            - --convert
            - --language
            - auto
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: dri
              mountPath: /dev/dri
            - name: kfd
              mountPath: /dev/kfd
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: models
          persistentVolumeClaim:
            claimName: ai-models-whisper-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-server
  namespace: ai-stack
spec:
  type: ClusterIP
  selector:
    app: whisper-server
  ports:
    - name: http
      port: 8080
      targetPort: http

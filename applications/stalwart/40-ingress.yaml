##############################################################################
# mail.home.dohrm.fr : WebUI d'administration, VPN uniquement (Caddy filtre
#   sur le tailnet ; nom déclaré dans applications/headscale/10-dns-sync.yaml).
#
# mail.dohrm.com : seulement le challenge ACME HTTP-01. Caddy occupe le port
#   80 public et transmet ce chemin à Traefik via un bloc `http://` dédié
#   (voir docs/stalwart-mail.md) ; Stalwart obtient et renouvelle lui-même le
#   certificat de ses listeners SMTP/IMAP.
##############################################################################
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalwart
  namespace: stalwart
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: mail.home.dohrm.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stalwart
                port:
                  number: 8080
    - host: mail.dohrm.com
      http:
        paths:
          - path: /.well-known/acme-challenge
            pathType: Prefix
            backend:
              service:
                name: stalwart
                port:
                  number: 8080

##############################################################################
# mail.dohrm.com, public. Caddy termine le TLS sur 443 (HTTPS : WebUI, JMAP,
#   OAuth) et transmet aussi le challenge ACME HTTP-01 reçu sur 80 : Stalwart
#   obtient lui-même le certificat de ses listeners SMTP/IMAP. Bloc Caddy dans
#   docs/stalwart-mail.md.
#
# Pas de filtre sur /admin : l'administration passe par l'API JMAP (/jmap),
#   la même que celle des clients. La protection est le compte admin (mot de
#   passe fort, 2FA) et l'auto-ban, qui voit l'IP réelle via X-Forwarded-For.
##############################################################################
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalwart
  namespace: stalwart
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: mail.dohrm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stalwart
                port:
                  number: 8080

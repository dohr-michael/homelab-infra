# KSOPS generator — déchiffre les secrets SOPS au moment du kustomize build
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: secrets-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - mongo-users.secret.yaml
  - mongo-temper-user.secret.yaml
  - mongo-temper-dev-user.secret.yaml
  - mongo-backup-s3.secret.yaml

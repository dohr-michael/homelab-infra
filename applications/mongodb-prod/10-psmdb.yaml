##############################################################################
# MongoDB PROD — replica set 3 membres, un par nœud
#
# TOPOLOGIE
#   Placement piloté par le label de nœud `role.homelab/mongodb-prod=true`,
#   pas par une liste de hostnames en dur. Aujourd'hui il est posé sur :
#     vps-a7c3e9b8, vps-17435151, gmk-ai-master
#   Quand le 3ᵉ VPS OVH arrive : on le labellise, on retire le label de
#   gmk-ai-master, l'opérateur reconstruit le membre sur le nouveau nœud.
#   Voir docs/critical-app-readiness.md § « Arrivée du nœud OVH ».
#
#   gmk-ai-master est un membre à part entière (pas un arbitre) : un arbitre
#   avec writeConcern majority est un anti-pattern MongoDB documenté (perte
#   de durabilité sur panne d'un porteur de données). Un 3ᵉ membre porteur de
#   données donne un vrai quorum 2/3 ET une 3ᵉ copie des données.
#
#   Le RS traverse le mesh Headscale (~11-30 ms de RTT entre nœuds). C'est le
#   coût des écritures en `w: majority` : compter ~30-60 ms par write ack.
#
# TOLERATIONS — les deux sont nécessaires, sinon le RS ne peut pas s'étaler :
#   - CriticalAddonsOnly=true:NoSchedule → vps-17435151 (sinon rien n'y va)
#   - dedicated=ai:NoSchedule            → gmk-ai-master
#
# TLS — `preferTLS` (défaut opérateur). Les certificats sont générés par
#   l'opérateur lui-même (pas de cert-manager dans le cluster) et sont
#   long-terme, donc à renouveler à la main. Le trafic inter-nœuds passe déjà
#   dans le tunnel WireGuard de Headscale. Passer à `requireTLS` demandera de
#   distribuer le CA aux clients — voir le doc.
##############################################################################

---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: mongo-prod
  namespace: mongodb-prod
  finalizers:
    # Arrête les pods dans l'ordre (secondaires avant primaire).
    # `delete-psmdb-pvc` est volontairement ABSENT : supprimer le CR ne doit
    # jamais effacer les données.
    - percona.com/delete-psmdb-pods-in-order
spec:
  crVersion: 1.23.0
  image: percona/percona-server-mongodb:8.0.26-11
  imagePullPolicy: IfNotPresent

  updateStrategy: SmartUpdate
  upgradeOptions:
    # Pas de montée de version automatique en prod : on la déclenche par
    # commit, jamais par un cron qui interroge check.percona.com.
    versionServiceEndpoint: https://check.percona.com
    apply: disabled
    schedule: "0 2 * * *"
    setFCV: false

  secrets:
    users: mongo-prod-users
    # Créée automatiquement par l'opérateur si absente (chiffrement at-rest).
    encryptionKey: mongo-prod-encryption-key

  tls:
    mode: preferTLS
    certManagementPolicy: auto
    # 10 ans — les certificats auto-générés ne se renouvellent PAS tout seuls.
    certValidityDuration: 87600h

  # Lectures/écritures sûres par défaut, au niveau serveur : même une app mal
  # configurée écrit en majority.
  defaultRWConcern:
    readConcern: majority
    writeConcern:
      w: majority
      wtimeout: 0

  # Pas de bloc `pmm:` — le CRD impose `pmm.image` dès que la clé est présente
  # (spec.pmm.required = ['image']), même avec enabled: false. On ne s'en sert
  # pas : les métriques viennent du sidecar mongodb_exporter vers VictoriaMetrics.

  sharding:
    enabled: false

  ############################################################################
  # Utilisateurs applicatifs déclaratifs — mots de passe lus dans des secrets
  # SOPS distincts.
  #
  # AJOUTER UN COMPTE / UNE BASE = ajouter une entrée ici + un secret SOPS.
  #   1. créer `mongo-<nom>-user.secret.yaml` (stringData.password), le chiffrer
  #   2. l'ajouter à ksops-generator.yaml
  #   3. ajouter l'entrée ci-dessous, commit
  # L'opérateur crée l'utilisateur, et MongoDB crée la base à la première
  # écriture (il n'y a rien à « créer » côté base : elle naît avec ses données).
  #
  # ⚠️ RETIRER UNE ENTRÉE ICI NE SUPPRIME PAS LE COMPTE DU CLUSTER.
  # Vérifié sur l'opérateur 1.23.0 le 2026-08-07 : il ne conserve aucune trace
  # des comptes personnalisés qu'il a créés, donc il ne peut pas détecter une
  # disparition. Un compte « retiré » du dépôt reste utilisable indéfiniment avec
  # son ancien mot de passe. Le `dropUser` est à faire à la main —
  # voir docs/critical-app-readiness.md § « Ajouter un compte / une base ».
  #
  # `db:` est la base d'AUTHENTIFICATION de l'utilisateur, et elle doit être
  # reprise dans le DSN en `authSource=` — sinon le driver cherche le compte
  # dans `admin` et l'authentification échoue.
  #
  # DEV ET PROD PARTAGENT CE REPLICA SET, isolés par base de données.
  # Le cluster `mongodb-dev` a été supprimé le 2026-08-06 : aucune image Percona
  # actuelle (testé jusqu'à 8.3.7-1) ne démarre sur un kernel >= 6.19, et le
  # seul nœud qui avait la capacité pour dev (gmk-ai-master) est en 7.1.6.
  #
  # Ce que l'isolation par base garantit : `temper-dev` a readWrite sur
  # `temper_dev` et RIEN sur `temper`, et réciproquement. Un mauvais DSN ne peut
  # pas écrire dans la base de l'autre environnement.
  #
  # Ce qu'elle ne garantit PAS, et qu'il faut avoir en tête :
  #   - même cache WiredTiger (409 MiB, voir cacheSizeRatio plus bas) : une
  #     requête de dev qui parcourt une grosse collection évince le working set
  #     de prod
  #   - même oplog, mêmes connexions, mêmes I/O disque
  #   - les backups PBM couvrent tout le cluster, donc `temper_dev` part aussi
  #     chez OVH
  # Autrement dit : dev peut dégrader prod. Pas la corrompre, mais la ralentir.
  ############################################################################
  users:
    - name: temper
      db: temper
      passwordSecretRef:
        name: mongo-prod-temper-user
        key: password
      roles:
        - name: readWrite
          db: temper
    # Base nommée avec un underscore et non `temper-dev` : un nom de base à
    # tiret est légal en MongoDB, mais casse la notation `db.temper-dev` dans
    # mongosh (interprétée comme une soustraction) et impose partout
    # `getSiblingDB("temper-dev")`. Le compte, lui, garde le tiret.
    - name: temper-dev
      db: temper_dev
      passwordSecretRef:
        name: mongo-prod-temper-dev-user
        key: password
      roles:
        - name: readWrite
          db: temper_dev

  replsets:
    - name: rs0
      size: 3

      nodeSelector:
        role.homelab/mongodb-prod: "true"

      # Évincé en dernier sous pression mémoire sur les nœuds à 8 Go.
      priorityClassName: homelab-data

      # Scrape piloté par annotation : vmagent découvre les pods via le job
      # `kubernetes-pods`. On évite ainsi de dépendre des labels exacts que
      # l'opérateur pose sur ses pods (qui changent entre versions).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9216"
        prometheus.io/path: /metrics

      affinity:
        antiAffinityTopologyKey: kubernetes.io/hostname

      tolerations:
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: dedicated
          operator: Equal
          value: ai
          effect: NoSchedule

      podDisruptionBudget:
        maxUnavailable: 1

      expose:
        enabled: false
        type: ClusterIP

      configuration: |
        operationProfiling:
          mode: slowOp
          slowOpThresholdMs: 200
        systemLog:
          quiet: true

      storage:
        engine: wiredTiger
        wiredTiger:
          engineConfig:
            # ATTENTION À LA FORMULE : le ratio ne s'applique PAS à la limite
            # mémoire, mais à `limite - 1 Gi` (le 1 Gi représente ce que mongod
            # consomme hors cache : connexions, tris, agrégations).
            #
            #     (2 Gi - 1 Gi) × 0.4 = 0.4 GiB = 409 MiB
            #
            # Mesuré le 2026-08-07, identique sur les 3 membres : mongod tourne
            # avec `wiredTigerCacheSizeGB=0.40` et `serverStatus().wiredTiger
            # .cache["maximum bytes configured"]` vaut 428867584 (409 MiB).
            # Les commentaires précédents annonçaient ~800 Mi : c'était faux
            # d'un facteur 2.
            #
            # Répartition réelle des 2 Gi : ~409 MiB de cache, ~1,6 Gi de marge.
            # C'est volontairement conservateur. Le défaut MongoDB (50 % de
            # RAM-1G, soit ~3,5 Gi sur ces nœuds à 8 Go) ferait OOM le nœud.
            #
            # NON AJUSTÉ POUR L'INSTANT (décision du 2026-08-07) : la valeur
            # sera revue avec une sonde de performance une fois l'application
            # déployée, plutôt qu'au doigt mouillé. Marge disponible si besoin :
            # 0.7 donnerait ~716 MiB en laissant encore ~1,3 Gi.
            cacheSizeRatio: 0.4
            journalCompressor: snappy
          collectionConfig:
            blockCompressor: snappy
          indexConfig:
            prefixCompression: true

      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1500m"
          memory: 2Gi

      volumeSpec:
        persistentVolumeClaim:
          storageClassName: local-path-retain
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

      # Exporter Prometheus en sidecar : co-localisé avec chaque mongod, donc
      # on obtient le lag de réplication et l'état PAR MEMBRE. Un exporter
      # unique derrière le Service ne verrait que le primaire.
      sidecars:
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.52.0
          args:
            - --mongodb.uri=mongodb://127.0.0.1:27017/admin
            - --mongodb.direct-connect
            - --web.listen-address=:9216
            - --collect-all
            - --compatible-mode
          env:
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: mongo-prod-users
                  key: MONGODB_CLUSTER_MONITOR_USER
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-prod-users
                  key: MONGODB_CLUSTER_MONITOR_PASSWORD
          ports:
            - name: metrics
              containerPort: 9216
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi

  backup:
    ##########################################################################
    # ACTIVÉ le 2026-08-08, après création du bucket OVH.
    #
    # ⚠️ NE JAMAIS RÉACTIVER CE BLOC SANS AVOIR VALIDÉ LE BUCKET D'ABORD.
    # Le 2026-08-06, avec un bucket inexistant et des credentials factices,
    # l'agent PBM bouclait sur
    #     check storage connection: ... get S3 object header: operation error
    #     S3: HeadObject
    # et l'opérateur restait bloqué à cette étape de la réconciliation. Il
    # n'atteignait donc JAMAIS la création des utilisateurs de spec.users : le
    # cluster restait en `initializing`, aucun compte applicatif n'existait.
    #
    # Validation faite le 2026-08-08 avant activation, sur le bucket ci-dessous
    # et avec les credentials de mongo-prod-backup-s3 :
    #     HEAD 200 · PUT 200 · GET 200 · DELETE 204
    # Cloisonnement vérifié : l'utilisateur S3 « upload » reçoit 403 sur ce
    # bucket. Refaire ce test avant toute rotation de credentials ou changement
    # de bucket — c'est cinq minutes qui évitent de casser le cluster.
    #
    # ⚠️ VERSIONING ACTIF SUR CE BUCKET. `retention.deleteFromStorage: true`
    # ci-dessous ne libère donc RIEN par lui-même : chaque suppression crée une
    # version non-courante qui s'accumule indéfiniment. Mesuré le 2026-08-08 :
    # un PUT suivi d'un DELETE laisse 1 Version + 1 DeleteMarker. La rétention
    # PBM est cosmétique sans une lifecycle rule OVH portant
    # `NoncurrentVersionExpiration` (30 j) et `ExpiredObjectDeleteMarker: true`.
    #
    # L'alerte PSMDBNoBackupEver reste légitime tant que le premier backup n'est
    # pas passé. Le PITR ne démarre qu'après un backup de base abouti.
    ##########################################################################
    enabled: true
    image: percona/percona-backup-mongodb:2.15.0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

    storages:
      ovh-s3:
        main: true
        type: s3
        s3:
          # Bucket OVH créé le 2026-08-08. Région eu-west-par (3-AZ) : la
          # durabilité prime pour des backups, la latence n'a aucune importance.
          # endpointUrl attend le schéma ET pas de slash final — contrairement à
          # `etcd-s3-endpoint` côté k3s, qui veut le hostname nu. Les deux
          # formats diffèrent, c'est une source d'erreur classique.
          bucket: wrathful-millikan-mdohr
          region: eu-west-par
          endpointUrl: https://s3.eu-west-par.io.cloud.ovh.net
          prefix: mongodb-prod
          credentialsSecret: mongo-prod-backup-s3
          retryer:
            numMaxRetries: 5
            minRetryDelay: 1s
            maxRetryDelay: 2m

    # Point-in-time recovery : PBM pousse les chunks d'oplog en continu.
    # Sans ça, le RPO est l'intervalle entre deux backups (24 h).
    # Nécessite au moins un backup de base terminé pour démarrer.
    pitr:
      enabled: true
      oplogOnly: false
      oplogSpanMin: 10
      compressionType: gzip
      compressionLevel: 6

    tasks:
      - name: daily-logical
        enabled: true
        schedule: "0 2 * * *"
        type: logical
        # Obligatoire en pratique : l'opérateur refuse de réconcilier une tâche
        # sans storageName ("there is no storage  in cluster"). Le CRD ne le
        # marque pourtant pas required — aucun validateur statique ne l'attrape.
        storageName: ovh-s3
        retention:
          count: 7
          type: count
          deleteFromStorage: true
        compressionType: gzip
        compressionLevel: 6
      - name: weekly-physical
        enabled: true
        schedule: "0 4 * * 0"
        type: physical
        storageName: ovh-s3
        retention:
          count: 4
          type: count
          deleteFromStorage: true
        compressionType: gzip
        compressionLevel: 6

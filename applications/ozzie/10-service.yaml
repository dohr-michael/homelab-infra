##############################################################################
# OpenClaw — exposé via Service + Endpoints (pattern headless)
#
# OpenClaw tourne directement sur l'hôte gmk-ai-master, hors cluster.
# K8s route le trafic sans gérer de pod (même pattern que sd-server/ComfyUI).
#
# Port sur le nœud : 18789
##############################################################################

---
apiVersion: v1
kind: Service
metadata:
  name: ozzie
  namespace: ozzie
  labels:
    app: ozzie
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 18789
      targetPort: 18789
      protocol: TCP

---
apiVersion: v1
kind: Endpoints
metadata:
  name: ozzie
  namespace: ozzie
  labels:
    app: ozzie
subsets:
  - addresses:
      - ip: 100.64.0.4   # gmk-ai-master (IP Headscale)
    ports:
      - name: http
        port: 18789
        protocol: TCP

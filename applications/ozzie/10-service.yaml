##############################################################################
# OpenClaw — exposé via Service + EndpointSlice (pattern headless)
#
# OpenClaw tourne directement sur l'hôte gmk-ai-master, hors cluster.
# K8s route le trafic sans gérer de pod (même pattern que sd-server/ComfyUI).
#
# Port sur le nœud : 18789
##############################################################################

---
apiVersion: v1
kind: Service
metadata:
  name: ozzie
  namespace: ozzie
  labels:
    app: ozzie
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 18789
      targetPort: 18789
      protocol: TCP

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ozzie-static
  namespace: ozzie
  labels:
    kubernetes.io/service-name: ozzie
addressType: IPv4
endpoints:
  - addresses:
      - 100.64.0.4   # gmk-ai-master (IP Headscale)
    conditions:
      ready: true
ports:
  - name: http
    port: 18789
    protocol: TCP

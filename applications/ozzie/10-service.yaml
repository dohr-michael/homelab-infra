##############################################################################
# OpenClaw — exposé via Service + Endpoints (pattern headless)
#
# OpenClaw tourne directement sur l'hôte gmk-ai-master, hors cluster.
# K8s route le trafic sans gérer de pod (même pattern que sd-server/ComfyUI).
#
# Port sur le nœud : 18789
#
# ⚠️ NE PAS migrer vers EndpointSlice. `v1 Endpoints` est déprécié depuis 1.33,
#   mais ArgoCD exclut `discovery.k8s.io/EndpointSlice` dans son
#   `resource.exclusions` par défaut (trop de churn côté control-plane) : une
#   EndpointSlice déclarée ici ne serait jamais appliquée
#   (ExcludedResourceWarning). Le mirroring controller de K8s génère de toute
#   façon la slice à partir de cet Endpoints, donc kube-proxy en consomme bien
#   une. Vérifié le 2026-09-25.
##############################################################################

---
apiVersion: v1
kind: Service
metadata:
  name: ozzie
  namespace: ozzie
  labels:
    app: ozzie
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 18789
      targetPort: 18789
      protocol: TCP

---
apiVersion: v1
kind: Endpoints
metadata:
  name: ozzie
  namespace: ozzie
  labels:
    app: ozzie
subsets:
  - addresses:
      - ip: 100.64.0.4   # gmk-ai-master (IP Headscale)
    ports:
      - name: http
        port: 18789
        protocol: TCP
